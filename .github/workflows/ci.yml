name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Build the frontend FIRST. web/embed.go embeds web/dist via
      # `//go:embed all:dist`, so the web and cmd/server packages only compile
      # once `vite build` has produced web/dist — and `go vet ./...` /
      # `go test ./...` below compile those packages.
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Go vet
        run: go vet ./...

      # -race is kept: the suite runs clean under the race detector in a
      # reasonable time (modernc.org/sqlite is pure-Go, no cgo needed).
      - name: Go test
        run: go test -race ./...
